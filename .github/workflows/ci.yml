name: CI

# Every pull request is linted, tested, built and scanned.
# A push to main additionally publishes the images to Docker Hub and points
# the dev environment at them, which Argo CD then rolls out.

on:
  pull_request:
  push:
    branches: [main]
    # Changes that do not alter the application need no new images. This
    # also covers the dev image tag update that this workflow commits itself.
    paths-ignore:
      - deploy/**
      - docs/**
      - "**.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest --cov --cov-report=term

  frontend:
    name: Frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  images:
    name: Images · build, scan, smoke test, publish
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      BACKEND_IMAGE: solarcast-backend:ci
      FRONTEND_IMAGE: solarcast-frontend:ci
      # Publish only from main, and only once Docker Hub is configured
      # (repository variable DOCKERHUB_USERNAME + secret DOCKERHUB_TOKEN).
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOCKERHUB_USERNAME != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          load: true
          tags: ${{ env.BACKEND_IMAGE }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          load: true
          tags: ${{ env.FRONTEND_IMAGE }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # Fail the build on any HIGH or CRITICAL vulnerability that has a fix.
      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # Start the real containers on synthetic data and exercise them
      # end to end through nginx: train, predict, history.
      - name: Smoke test
        env:
          SOLARCAST_DATA_PATH: ./backend/sample_data
        run: |
          docker compose up --detach --wait --no-build
          ./scripts/smoke-test.sh

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose down --volumes

      # ── Publish (main only) ────────────────────────────────────────────────
      # Rebuilt from the layer cache for both Intel and Apple-silicon/ARM hosts.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: env.PUBLISH == 'true'

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish backend image
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/solarcast-backend:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/solarcast-backend:latest
          cache-from: type=gha,scope=backend

      - name: Publish frontend image
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/solarcast-frontend:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/solarcast-frontend:latest
          cache-from: type=gha,scope=frontend

  deploy-dev:
    name: Deploy · point dev at the new images
    runs-on: ubuntu-latest
    needs: images
    # Same condition as publishing: main only, and Docker Hub configured.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOCKERHUB_USERNAME != ''
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      # GitOps: CI never touches the cluster. It records the new version in
      # Git, and Argo CD notices the commit and rolls dev out.
      - name: Set the dev image tag to this commit
        run: |
          sed -i -E "s/^( *newTag: ).*/\1${GITHUB_SHA}/" deploy/overlays/dev/kustomization.yaml

          if git diff --quiet; then
            echo "Dev already runs ${GITHUB_SHA}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --all --message "deploy(dev): run ${GITHUB_SHA::7}"

          # Another merge may have landed meanwhile: rebase onto it and retry.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          echo "Could not push the dev image tag update." >&2
          exit 1