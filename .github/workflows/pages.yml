name: Demo site

# Builds a static demo of the dashboard and publishes it to GitHub Pages.
# The demo has no backend: its data is generated here, at build time, from
# synthetic readings only (see backend/scripts/export_demo_data.py).

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - backend/**
      - .github/workflows/pages.yml
  # Rebuild on the 1st of every month so the history and forecast stay current.
  schedule:
    - cron: "30 1 1 * *"
  workflow_dispatch:

permissions:
  contents: read

# Never run two deployments at once, and let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Generate demo data (synthetic)
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m scripts.export_demo_data ../frontend/public/demo

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build dashboard in demo mode
        working-directory: frontend
        env:
          VITE_DEMO_MODE: "true"
        run: |
          npm ci
          # Project sites are served from /<repository name>/
          VITE_BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
