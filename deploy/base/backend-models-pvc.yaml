# A request for 1 GiB of persistent storage for trained models. The cluster's
# default StorageClass creates the actual volume when the backend pod first
# needs it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-models
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: solarcast
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
