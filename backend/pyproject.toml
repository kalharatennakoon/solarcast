# Tooling configuration for the SolarCast backend (not a package definition).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:prophet.*",
    "ignore::DeprecationWarning:cmdstanpy.*",
    "ignore::FutureWarning:prophet.*",
]

[tool.coverage.run]
source = ["api", "model", "settings"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py314"
extend-exclude = ["sample_data"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import order, B: likely bugs
select = ["E", "W", "F", "I", "B"]
ignore = [
    "E501",  # line length — existing code favours readable long lines
]

[tool.ruff.lint.isort]
known-first-party = ["api", "model", "settings"]
